<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Dharshan Paramasivan  Signal Sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="55%" stop-color="#06140c"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22c55e" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- matrix rain columns -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#22c55e">
    <g opacity="0.35">
      <text x="48" y="40">01</text><text x="48" y="58">10</text><text x="48" y="76">11</text><text x="48" y="94">01</text>
      <text x="180" y="70">0A</text><text x="180" y="88">F2</text><text x="180" y="106">3C</text>
      <text x="320" y="50">##</text><text x="320" y="68">&lt;/&gt;</text><text x="320" y="86">**</text>
      <text x="980" y="60">SEC</text><text x="980" y="78">URE</text><text x="980" y="96">API</text>
      <text x="1100" y="90">01</text><text x="1100" y="108">10</text><text x="1100" y="126">11</text>
    </g>
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite"/>
  </g>

  <circle cx="980" cy="90" r="90" fill="#22c55e" opacity="0.08" filter="url(#soft)">
    <animate attributeName="r" values="70;100;70" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="280" r="110" fill="#22d3ee" opacity="0.07" filter="url(#soft)">
    <animate attributeName="r" values="90;120;90" dur="6s" repeatCount="indefinite"/>
  </circle>

  <rect x="48" y="48" width="1104" height="264" rx="10" fill="#050805" stroke="#22c55e" stroke-opacity="0.35"/>
  <rect x="48" y="48" width="1104" height="36" rx="10" fill="#0b1a12"/>
  <circle cx="74" cy="66" r="6" fill="#ef4444"/>
  <circle cx="96" cy="66" r="6" fill="#eab308"/>
  <circle cx="118" cy="66" r="6" fill="#22c55e"/>
  <text x="150" y="71" fill="#7d9988" font-family="ui-monospace, Consolas, monospace" font-size="13">root@signal-sheet:~</text>

  <text x="80" y="130" fill="#22c55e" font-family="ui-monospace, Consolas, monospace" font-size="16">$ whoami</text>
  <text x="80" y="168" fill="#f4f7fb" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="700">DHARSHAN PARAMASIVAN</text>
  <text x="80" y="208" fill="#22d3ee" font-family="ui-monospace, Consolas, monospace" font-size="18">Full-Stack Engineer  |  QA Automation  |  API Security</text>
  <text x="80" y="246" fill="#9fb3a7" font-family="ui-monospace, Consolas, monospace" font-size="15">BUILD -&gt; VERIFY -&gt; SECURE -&gt; SHIP   ·   Coimbatore / Remote</text>

  <rect x="80" y="270" width="220" height="18" rx="4" fill="#0f291c" stroke="#22c55e" stroke-opacity="0.4"/>
  <rect x="80" y="270" width="150" height="18" rx="4" fill="url(#glow)">
    <animate attributeName="width" values="40;210;150" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="310" y="284" fill="#7d9988" font-family="ui-monospace, Consolas, monospace" font-size="12">session: OPEN_TO_ROLES</text>

  <!-- scanline -->
  <rect x="48" width="1104" height="28" fill="#22c55e" opacity="0.06">
    <animate attributeName="y" values="48;312;48" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
